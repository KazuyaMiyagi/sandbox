name: reviewdog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-tflint@c332ae72f14fd853c08323a60383b396cc34715a # v1.28.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          tflint_init: true
          tflint_config: ${{ github.workspace }}/tflint/tflint.hcl
          # default: "--call-module-type=all"
          # all だと terraform init をする必要がある
          flags: >-
            --recursive
            --call-module-type local

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-trivy@1d4e9cf7cd9d2a130f84f9c4d171dcdea3af5348 # v1.17.1
        with:
          github_token: ${{ secrets.github_token }}
          filter_mode: added
          reporter: github-pr-review
          level: info
          fail_on_error: true
          trivy_version: latest
          trivy_command: config
          trivy_target: .

  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-detect-secrets@d4720f862b52060d151f232944d0f6151eea9a9f # v0.31.3
        with:
          github_token: ${{ secrets.github_token }}
          fail_on_error: false
          filter_mode: added
          level: error
          reporter: github-pr-review
