name: reviewdog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-tflint@ac21f7671251b29bbeb280ede595cb9c5b8710c7 # v1.26.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          tflint_init: true
          tflint_config: ${{ github.workspace }}/tflint/tflint.hcl
          # default: "--call-module-type=all"
          # all だと terraform init をする必要がある
          flags: >-
            --recursive
            --call-module-type local

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-trivy@765ed28176fa16dcac6ced7a652f51f6fd871174 # v1.16.0
        with:
          github_token: ${{ secrets.github_token }}
          filter_mode: added
          reporter: github-pr-review
          level: info
          fail_on_error: true
          trivy_version: latest
          trivy_command: config
          trivy_target: .

  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-detect-secrets@3bc07a8ce36864e49536f7dba77f7c69ff5219a3 # v0.31.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_on_error: false
          filter_mode: added
          level: error
          reporter: github-pr-review
